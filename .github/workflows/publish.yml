name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun --cwd <dir> run <script>` prints help and exits 0 without running anything,
      # which once shipped tarballs without dist/. Use working-directory instead.
      - name: Lint
        working-directory: packages/ezlet
        run: bun run lint

      - name: Typecheck
        working-directory: packages/ezlet
        run: bun run typecheck

      - name: Test
        working-directory: packages/ezlet
        run: bun test

      - name: Build
        working-directory: packages/ezlet
        run: bun run build

      - name: Verify build output
        working-directory: packages/ezlet
        run: test -f dist/index.js && test -f dist/index.d.ts && test -f dist/styles.css

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/ezlet/package.json').version")
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag is empty."
            exit 1
          fi
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release tag ($RELEASE_TAG) does not match packages/ezlet/package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Verify package contents
        working-directory: packages/ezlet
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/ezlet
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
